<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" width="660" height="330" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="13">
  <style>
    .bar { fill: #e8e8ed; }
    .panel { fill: #f6f6f8; stroke: #c9c9cf; }
    .text { fill: #1d1d1f; }
    .dim { fill: #8e8e93; }
    .sep { stroke: #d6d6db; }
    .hl { fill: #2f6fe4; }
    .hltext { fill: #ffffff; }
    .icon { stroke: #1d1d1f; }
    @media (prefers-color-scheme: dark) {
      .bar { fill: #2a2a2e; }
      .panel { fill: #2c2c30; stroke: #4a4a50; }
      .text { fill: #f2f2f7; }
      .dim { fill: #8e8e93; }
      .sep { stroke: #48484e; }
      .icon { stroke: #f2f2f7; }
    }
  </style>

  <!-- menu bar with the status item -->
  <rect class="bar" x="0" y="0" width="660" height="26" rx="6"/>
  <rect x="16" y="3" width="26" height="20" rx="5" fill="#8e8e93" fill-opacity="0.25"/>
  <g class="icon" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(21 5)">
    <path d="M11 15.5v-2.2c2.6-.6 4.3-2.8 4.3-5.6C15.3 4.4 12.7 2 9.3 2 6 2 3.4 4.4 3.4 7.5L2 10.2l1.6.5v2c0 1 .8 1.7 1.8 1.7H7v1.1"/>
    <path d="M7.4 7.8c-.3-1.3.7-2.6 2-2.6.5-.9 1.8-1 2.4-.2 1 .1 1.6 1.2 1.2 2.1.4.9-.2 2-1.2 2.1-.6.8-1.9.7-2.4-.2-1 .1-1.9-.4-2-1.2z"/>
  </g>
  <text class="text" x="610" y="17.5" text-anchor="end" font-weight="500">Sat 11 Oct  02:10</text>

  <!-- the menu -->
  <rect class="panel" x="16" y="30" width="628" height="292" rx="9"/>
  <g transform="translate(16 36)">
    <text class="dim" x="20" y="15">lily: Ready</text>
    <text class="dim" x="20" y="37">Model: Qwen3.8-Flash-Next</text>
    <text class="dim" x="20" y="59">Memory: 70.9 GB</text>
    <text class="dim" x="20" y="81">Last request: 31 tokens at 107.5 tok/s, prompt 43 (0 cached) at 233.5 tok/s, 6 min ago</text>
    <line class="sep" x1="12" x2="616" y1="93.5" y2="93.5"/>

    <rect class="hl" x="6" y="99" width="616" height="22" rx="5"/>
    <text class="hltext" x="20" y="114">Stop Server</text>
    <text class="hltext" x="604" y="114" text-anchor="end">⌘S</text>
    <text class="text" x="20" y="136">Restart Server</text>
    <text class="dim" x="604" y="136" text-anchor="end">⌘R</text>
    <line class="sep" x1="12" x2="616" y1="148.5" y2="148.5"/>

    <text class="text" x="20" y="169">Copy API URL (http://127.0.0.1:8000/v1)</text>
    <text class="dim" x="604" y="169" text-anchor="end">⌘C</text>
    <text class="text" x="20" y="191">Show Server Log</text>
    <text class="dim" x="604" y="191" text-anchor="end">⌘L</text>
    <line class="sep" x1="12" x2="616" y1="203.5" y2="203.5"/>

    <text class="text" x="7" y="224">✓</text>
    <text class="text" x="20" y="224">Open at Login</text>
    <text class="dim" x="20" y="246">LilyMenu 1.0.0</text>
    <text class="text" x="20" y="268">Quit LilyMenu</text>
    <text class="dim" x="604" y="268" text-anchor="end">⌘Q</text>
  </g>
</svg>
